name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "RedFish/**"
      - "RedFish.xcodeproj/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project RedFish.xcodeproj \
            -scheme RedFish \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_PREVIEWS=NO \
            clean build | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===== Extrait des erreurs ====="
            grep -E " error: |: error:" xcodebuild.log | head -n 120 || true
            exit "$status"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Create payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/RedFish.app Payload/

      - name: Package IPA
        run: |
          /usr/bin/zip -r RedFish-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedFish-ipa
          path: RedFish-unsigned.ipa

      - name: Rappel installation (Sideloadly)
        run: |
          echo "=== IPA non signée ==="
          echo "1) Télécharge l'artifact RedFish-ipa depuis l'onglet Actions de GitHub."
          echo "2) Ouvre Sideloadly (Windows), connecte ton iPhone, glisse RedFish-unsigned.ipa."
          echo "3) Sideloadly re-signera avec ton Apple ID (compte gratuit = certificat ~7 jours)."
          echo "Sans cette étape, l'iPhone refusera l'installation (iOS impose une signature)."
