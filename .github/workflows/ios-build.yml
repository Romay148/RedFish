name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: xcodebuild
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      # actool exige exactement 1024×1024 pour l’icône « single size » ; normalise si le dépôt contient une autre taille.
      - name: Normaliser l’icône App (1024×1024)
        run: |
          set -euo pipefail
          ICON="$(find . -path '*/AppIcon.appiconset/AppIcon.png' -type f -print -quit || true)"
          if [ -z "$ICON" ]; then
            echo "AppIcon.png introuvable"
            exit 1
          fi
          echo "Icône: $ICON"
          sips -g pixelWidth -g pixelHeight "$ICON" || true
          sips -z 1024 1024 "$ICON" --out "$ICON"
          sips -g pixelWidth -g pixelHeight "$ICON"

      - name: Build (simulateur générique)
        run: |
          set -o pipefail
          xcodebuild \
            -project RedFish.xcodeproj \
            -scheme RedFish \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
