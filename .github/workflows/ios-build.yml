# Compilation iOS sur runner macOS (pas besoin de Mac local).
name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: xcodebuild
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Icône 1024×1024 + build simulateur
        run: |
          set -euo pipefail
          PROJ_DIR="$(dirname "$(find "$GITHUB_WORKSPACE" -name 'RedFish.xcodeproj' -type d | head -n 1)")"
          echo "Dossier projet: $PROJ_DIR"
          test -f "$PROJ_DIR/RedFish.xcodeproj/project.pbxproj"

          ICON="$(find "$PROJ_DIR" -path '*/AppIcon.appiconset/AppIcon.png' -type f | head -n 1 || true)"
          if [ -n "$ICON" ] && [ -f "$ICON" ]; then
            echo "Normalisation icône: $ICON"
            sips -g pixelWidth -g pixelHeight "$ICON" || true
            sips -z 1024 1024 "$ICON" --out "$ICON"
            sips -g pixelWidth -g pixelHeight "$ICON"
          else
            echo "::warning::AppIcon.png introuvable sous AppIcon.appiconset"
          fi

          cd "$PROJ_DIR"
          xcodebuild \
            -project RedFish.xcodeproj \
            -scheme RedFish \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
