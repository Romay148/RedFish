name: Build IPA (minimal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RedFish.xcodeproj \
            -scheme RedFish \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            clean build | tee xcodebuild.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== Extrait des erreurs ====="
            grep -E " error: |: error:" xcodebuild.log | head -n 120 || true
            exit "$status"
          fi

      - name: Create payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/RedFish.app Payload/

      - name: Package IPA
        run: |
          /usr/bin/zip -r RedFish-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedFish-ipa
          path: RedFish-unsigned.ipa
